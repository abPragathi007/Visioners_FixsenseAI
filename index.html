<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-powered bike and auto health diagnostics for Indian vehicles.">
  <title>Bike Health AI — India's Smart Vehicle Health Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>

<body>
  <div id="app">
    <header id="app-top-nav" class="app-top-nav" aria-label="Main navigation" aria-hidden="true"></header>
    <section id="screen-splash" class="screen active" aria-label="Welcome"></section>
    <section id="screen-home" class="screen" aria-label="Home"></section>
    <section id="screen-diagnose" class="screen" aria-label="Diagnose"></section>
    <section id="screen-loading" class="screen" aria-label="Analyzing"></section>
    <section id="screen-results" class="screen" aria-label="Results"></section>
    <section id="screen-history" class="screen" aria-label="History"></section>
    <section id="screen-tips" class="screen" aria-label="Tips"></section>
    <section id="screen-profile" class="screen" aria-label="Profile"></section>
    <section id="screen-add-vehicle" class="screen" aria-label="Add vehicle"></section>
    <section id="screen-emergency" class="screen overlay-screen" aria-label="Emergency guide"></section>
    <section id="screen-fleet" class="screen overlay-screen" aria-label="Fleet overview"></section>
    <section id="screen-pretrip" class="screen overlay-screen" aria-label="Pre-trip check"></section>
  </div>

  <nav id="app-bottom-nav" class="bottom-nav app-bottom-nav-fixed" aria-label="Main navigation"></nav>

  <div id="ai-chat-root"></div>

  <script src="js/i18n/translations.js"></script>
  <script src="js/state.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/screens/splash.js"></script>
  <script src="js/screens/loading.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/addVehicle.js"></script>
  <script src="js/screens/diagnose.js"></script>
  <script src="js/screens/results.js"></script>
  <script src="js/screens/history.js"></script>
  <script src="js/screens/tips.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/emergency.js"></script>
  <script src="js/screens/fleet.js"></script>
  <script src="js/screens/pretrip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="js/screens/esp32.js"></script>
  <script src="js/components/aiChat.js"></script>
  <script src="js/app.js"></script>

</html>
